
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ZAREK AI</title>
<style>
body {
  margin: 0;
  background: #050914;
  color: white;
  font-family: Arial, sans-serif;
  text-align: center;
}
.container { padding: 45px 20px; }
h1 {
  color: #00c8ff;
  letter-spacing: 6px;
  font-size: 38px;
}
.circle {
  width: 150px;
  height: 150px;
  border: 3px solid #00c8ff;
  border-radius: 50%;
  margin: 45px auto;
  box-shadow: 0 0 30px #00c8ff;
  animation: pulse 2s infinite;
}
@keyframes pulse {
  50% { box-shadow: 0 0 55px #00c8ff; }
}
p { color: #a8c8df; }
button {
  background: #00aaff;
  color: white;
  border: none;
  padding: 16px 30px;
  border-radius: 30px;
  font-size: 17px;
  margin: 10px;
}
#status { min-height: 25px; }
</style>
</head>
<body>
<div class="container">
<h1>ZAREK AI</h1>
<div class="circle"></div>
<p>INTELLIGENT VOICE ASSISTANT</p>
<p id="status">Sistema en espera...</p>
<button onclick="activar()">ACTIVAR ZAREK</button>
<p id="respuesta"></p>
</div>

<script>
function hablar(texto) {
  speechSynthesis.cancel();

  const voz = new SpeechSynthesisUtterance(texto);
  voz.lang = "es-ES";
  voz.rate = 0.95;
  speechSynthesis.speak(voz);
}

function activar() {
  const prueba = window.SpeechRecognition || window.webkitSpeechRecognition;
alert(prueba ? "VOZ DISPONIBLE" : "VOZ NO DISPONIBLE");
  const Reconocimiento =
    window.SpeechRecognition || alert(typeof Reconocimiento);
    window.webkitSpeechRecognition;
  const estado = document.getElementById("status");
  const respuesta = document.getElementById("respuesta");

  if (!Reconocimiento) {
    estado.textContent = "Reconocimiento no disponible";
    return;
  }

  const reconocimiento = new Reconocimiento();

  reconocimiento.lang = "es-ES";
  reconocimiento.continuous = false;
  reconocimiento.interimResults = true;
  reconocimiento.maxAlternatives = 1;

  respuesta.textContent = "";

  reconocimiento.onstart = function() {
    estado.textContent = "ZAREK está escuchando...";
  };

  reconocimiento.onresult = function(event) {
    let texto = "";

    for (let i = event.resultIndex; i < event.results.length; i++) {
      texto += event.results[i][0].transcript;
    }

    respuesta.textContent = "Tú: " + texto;

    if (event.results[event.results.length - 1].isFinal) {
      const mensaje = texto.toLowerCase();

      let contestacion = "Te escucho. ¿Qué necesitas?";

      if (mensaje.includes("hola")) {
        contestacion = "Hola. Soy Zarek. Estoy listo para ayudarte.";
      } else if (mensaje.includes("cómo estás")) {
        contestacion = "Funcionando correctamente. ¿Qué hacemos hoy?";
      } else if (mensaje.includes("tu nombre")) {
        contestacion = "Soy Zarek, tu asistente inteligente.";
      } else if (mensaje.includes("adiós")) {
        contestacion = "Hasta pronto. Zarek queda en espera.";
      }

      respuesta.textContent = "ZAREK: " + contestacion;
      estado.textContent = "ZAREK respondió.";
      hablar(contestacion);
    }
  };

  reconocimiento.onerror = function(event) {
    estado.textContent = "Error de voz: " + event.error;
  };

  reconocimiento.onnomatch = function() {
    estado.textContent = "No pude reconocer tus palabras.";
  };

  reconocimiento.onend = function() {
    if (estado.textContent === "ZAREK está escuchando...") {
      estado.textContent = "No recibí una respuesta. Inténtalo otra vez.";
    }
  };

  try {
    reconocimiento.start();
  } catch (error) {
    estado.textContent = "No se pudo iniciar el micrófono.";
  }
}
</script>
